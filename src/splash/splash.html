        <title>Legcord</title>

            window.onbeforeunload = () => {
                const style = document.createElement("style");
                style.textContent = "body { display: none; }";
                document.head.append(style);
            };
        </script>
        <style>

            :root {
                --background-primary: #282b30;
                --background-secondary: rgba(255, 255, 255, 0.1);
                --brand-experiment: #7289da;
                --header-primary: #fff;
                --text-muted: #72767d;
            }

            @font-face {
                font-family: Whitney;
                font-weight: 400;
                font-style: normal;
                src: url(https://legcord.app/whitney_400.woff) format("woff");
            }

            html,
            body {
                -webkit-app-region: drag;
                overflow: hidden;
                margin: 0;
                padding: 0;
                width: 100%;
                height: 100%;
                background: var(--background-primary);
                display: flex;
                flex-direction: column;
                justify-content: center;
                align-items: center;
            }

            * {
                font-family: "Whitney", sans-serif;
                box-sizing: border-box;
                -webkit-user-select: none;
                user-select: none;
                cursor: default;
            }

            video {
                display: block;
                width: 200px;
                height: 150px;
                object-fit: cover;
                margin: 0 auto;
            }

            #text-splashscreen {
                font-size: 16px;
                text-align: center;
                color: var(--header-primary);
                font-weight: 400;
                font-style: italic;
                text-transform: uppercase;
                width: 100%;
            }

            #bar-container,
            #bar-fill {
                width: 180px;
                height: 8px;
                border-radius: 4px;
                visibility: hidden;
            }

            #bar-container {
                background-color: var(--background-secondary);
                position: relative;
                margin-top: 12px;
            }

            #bar-fill {
                background-color: var(--brand-experiment);
                width: 0;
            }

            #debug {
                position: absolute;
                bottom: 6px;
                right: 6px;
                text-align: right;
                font-size: 10px;
                color: var(--text-muted);
                white-space: pre;
            }

            img.logo {
                width: 272px;
            }

            button {
                background: var(--brand-experiment);
                color: var(--header-primary);
                outline: none;
                border: none;
                border-radius: 5px;
                padding: 8px;
                -webkit-user-select: all;
                user-select: all;
                margin: 0 auto;
                margin-top: 10px;
                -webkit-app-region: no-drag;
                transition: 0.17s ease;
                display: none;
            }
            button:hover {
                cursor: grab;
            }

        </style>
    </head>

    <body>
        <div class="container">
            <!-- biome-ignore lint/a11y/useMediaCaption: silent logo animation, no audio -->
            <video autoplay loop class="logo" id="splashscreen-legcord">
                <source src="legcord://assets/Loading.webm" type="video/webm" />
            </video>
            <p id="text-splashscreen"></p>
            <button id="ignore" type="button">Start anyway</button>
        </div>
    </body>
    <script>
        async function loadLang() {
            const text = document.getElementById("text-splashscreen");

            function check() {
                if (internal.installState === "installing") {
                    text.innerHTML = "Installing mods";
                } else if (internal.installState === "done") {
                    return true;
                } else if (internal.installState === "modDownload") {
                    text.innerHTML = `Updating ${internal.mods}`;
                } else if (internal.installState === "none") {
                    text.innerHTML = "Nothing to install.";
                    return true;
                } else {
                    return true;
                }
            }

            if (window.navigator.onLine === false) {
                for (let i = 0; i < 5; i++) {
                    await new Promise((r) => setTimeout(r, 1000));
                    text.innerHTML = `${(await internal.getLang("loading_screen_offline")) + (5 - i)}s`;
                }
                window.internal.restart();
            } else {
                text.innerHTML = await internal.getLang("loading_screen_start");
                if (internal.isDev) {
                    console.log("Development build detected. Skipping updater.");
                } else if (internal.isMicrosoftStore) {
                    console.log("Microsoft Store build detected. Skipping updater.")
                } else {
                    const response = await fetch("https://legcord.app/latest.json");
                    const data = await response.json();
                    const remoteVersion = data.version.replace(/\./g, ""); // easy to compare
                    if (remoteVersion > window.internal.version.replace(/\./g, "")) {
                        const elem = document.createElement("img");
                        elem.classList.add("logo");
                        elem.src = "legcord://assets/Update.webp";
                        document.body.prepend(elem);
                        document.getElementById("splashscreen-legcord").remove();
                        text.innerHTML = await internal.getLang("loading_screen_update");
                    } else {
                        console.log("Legcord is up to date.");
                    }
                }

                while (check() === false) await new Promise((r) => setTimeout(r, 10));
                setTimeout(() => {
                    window.internal.splashEnd();
                }, 3000);
            }
        }

        loadLang();
    </script>
</html>
